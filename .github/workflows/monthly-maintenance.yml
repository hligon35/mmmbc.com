name: Monthly maintenance

on:
  schedule:
    - cron: "0 6,7 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Check Indianapolis schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e "const fs=require('fs'); const hour=new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',hour:'2-digit',hourCycle:'h23'}).format(new Date()); fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(process.env.EVENT_NAME!=='schedule'||hour==='02')+'\n');"

      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Create maintenance branch
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          if git ls-remote --exit-code --heads origin monthly-maintenance >/dev/null 2>&1; then
            git fetch origin monthly-maintenance
            git switch monthly-maintenance 2>/dev/null || git switch --create monthly-maintenance --track origin/monthly-maintenance
            git merge --no-edit origin/master
          else
            git switch -c monthly-maintenance origin/master
          fi

      - name: Install locked dependencies
        if: steps.clock.outputs.run == 'true'
        run: npm ci

      - name: Apply safe in-range updates
        if: steps.clock.outputs.run == 'true'
        run: |
          npm update
          npm ci
          npm --prefix admin update
          npm --prefix admin ci

      - name: Verify repository privacy
        if: steps.clock.outputs.run == 'true'
        id: privacy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          echo "Repository visibility: ${visibility}"
          test "${visibility}" = "private"

      - name: Run maintenance checks
        if: steps.clock.outputs.run == 'true'
        id: checks
        continue-on-error: true
        run: npm run maintenance

      - name: Record workflow findings
        if: always() && steps.clock.outputs.run == 'true'
        run: |
          {
            echo
            echo "## Workflow guards"
            echo
            echo "- Maintenance checks: ${{ steps.checks.outcome }}"
            echo "- Repository privacy guard: ${{ steps.privacy.outcome }}"
          } >> monthlyReport.md

      - name: Commit report and safe updates
        if: always() && steps.clock.outputs.run == 'true' && steps.privacy.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json admin/package.json admin/package-lock.json monthlyReport.md
          git diff --cached --quiet || git commit -m "chore: monthly maintenance report"
          git push origin monthly-maintenance

      - name: Open or update pull request
        if: always() && steps.clock.outputs.run == 'true' && steps.privacy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base master --head monthly-maintenance --state open --json number --jq '.[0].number')"
          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" --title "Monthly maintenance" --body-file monthlyReport.md
          else
            gh pr create --base master --head monthly-maintenance --title "Monthly maintenance" --body-file monthlyReport.md
          fi

      - name: Email maintenance report
        if: always() && steps.clock.outputs.run == 'true' && steps.privacy.outcome == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAINTENANCE_TO_EMAIL: ${{ secrets.MAINTENANCE_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: node scripts/email_maintenance_report.mjs

      - name: Fail after preserving report
        if: steps.clock.outputs.run == 'true' && steps.checks.outcome == 'failure' || steps.privacy.outcome == 'failure'
        run: exit 1

