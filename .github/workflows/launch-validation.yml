name: Launch validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix admin ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workspace:browser
      - run: npm audit --audit-level=high
      - run: npm --prefix admin audit --audit-level=high
      - name: Preserve validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-validation-logs
          path: .wrangler/logs/
          if-no-files-found: ignore
